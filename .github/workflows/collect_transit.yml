name: Collect Transit Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Collect transit data
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          STRIDE_URL = "https://open-bus-stride-api.hasadna.org.il"
          OUTPUT_DIR = Path("data-buffer")
          OUTPUT_DIR.mkdir(exist_ok=True)

          collected_at = datetime.now(timezone.utc).isoformat()

          # ── Fetch bus positions (Gush Dan + wider Israel bbox) ───────────
          # Two calls: Gush Dan full detail + national sample for context
          buses = []
          try:
              # Call 1: All vehicles in Gush Dan bbox (complete coverage)
              r = requests.get(
                  f"{STRIDE_URL}/siri_vehicle_locations/list",
                  params={
                      "lat__greater_or_equal": 31.87,
                      "lat__lower_or_equal":   32.22,
                      "lon__greater_or_equal": 34.72,
                      "lon__lower_or_equal":   34.96,
                      "limit": 1000,
                      "order_by": "id desc",
                  },
                  timeout=25,
              )
              r.raise_for_status()
              raw = r.json()
              for rec in raw:
                  if rec.get("lat") is None or rec.get("lon") is None:
                      continue
                  recorded = rec.get("recorded_at_time", "")
                  if recorded and int(recorded[:4]) >= 2037:
                      continue  # filter sentinel timestamps
                  buses.append({
                      "vehicle_id":       str(rec.get("id", "")),
                      "route_id":         str(rec.get("siri_route_id") or rec.get("siri_route__id") or ""),
                      "trip_id":          str(rec.get("siri_ride_id") or ""),
                      "line_ref":         str(rec.get("siri_route__line_ref") or ""),
                      "route_short_name": str(rec.get("siri_route__line_ref") or ""),
                      "operator_id":      str(rec.get("siri_route__operator_ref") or ""),
                      "lat":              rec.get("lat"),
                      "lon":              rec.get("lon"),
                      "bearing":          rec.get("bearing"),
                      "velocity":         rec.get("velocity"),
                      "recorded_at":      recorded,
                      "collected_at":     collected_at,
                      "source":           "github-actions",
                  })
              print(f"Buses: {len(buses)} records")
          except Exception as e:
              print(f"Bus fetch failed: {e}", file=sys.stderr)

          # ── Write output files ────────────────────────────────────────────
          # Note: HERE Traffic fetch removed (API key revoked) — bus data only.
          (OUTPUT_DIR / "buses_latest.json").write_text(
              json.dumps(buses, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          meta = {
              "collected_at": collected_at,
              "bus_count":    len(buses),
          }
          (OUTPUT_DIR / "meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"Wrote data-buffer/: buses={len(buses)}, collected_at={collected_at}")
          PYEOF

      - name: Commit and push data snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data-buffer/buses_latest.json \
                  data-buffer/meta.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            git commit -m "chore(data): transit snapshot ${TIMESTAMP}"
            git push origin main
          fi
